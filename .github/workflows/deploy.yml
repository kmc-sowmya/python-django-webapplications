name: Promote Northstar Commerce

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: northstar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
        working-directory: backend

      - name: Prepare static output directory
        run: mkdir -p staticfiles
        working-directory: backend

      - name: Run Django tests
        run: python manage.py test
        working-directory: backend

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint and build frontend
        run: |
          npm run lint
          npm run build
        working-directory: frontend

      - name: Prepare Django-hosted frontend
        run: |
          mkdir -p backend/templates
          cp backend/static/frontend/index.html backend/templates/index.html

      - name: Collect static files and package app
        run: |
          python manage.py check
          python manage.py collectstatic --noinput
          zip -r ../release.zip . -x 'db.sqlite3' '*.pyc' '__pycache__/*' '.venv/*'
        working-directory: backend
        env:
          DJANGO_DEBUG: "true"

      - name: Upload deployable artifact
        uses: actions/upload-artifact@v4
        with:
          name: northstar-release
          path: release.zip
          if-no-files-found: error
          retention-days: 14

  deploy-dev:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy-stage.yml
    with:
      environment: DEV
    secrets: inherit

  deploy-si:
    needs: deploy-dev
    uses: ./.github/workflows/deploy-stage.yml
    with:
      environment: SI
    secrets: inherit

  deploy-qa:
    needs: deploy-si
    uses: ./.github/workflows/deploy-stage.yml
    with:
      environment: QA
    secrets: inherit

  deploy-uat:
    needs: deploy-qa
    uses: ./.github/workflows/deploy-stage.yml
    with:
      environment: UAT
    secrets: inherit

  deploy-prod:
    needs: deploy-uat
    if: github.ref == 'refs/heads/main' && vars.PROD_DEPLOY_ENABLED == 'true'
    uses: ./.github/workflows/deploy-stage.yml
    with:
      environment: PROD
    secrets: inherit
